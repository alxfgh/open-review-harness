# Papers ruled out by hand after reading their withdrawal comments, BEFORE any model saw them.
#
# The rule-based filter in src/review_harness/filters.py keeps comments that look specific. These
# passed it, but on reading cannot serve as an answer key. Reasons are public so that anyone can
# disagree. Nothing may be added here after a model has been run on a sample: to change the list,
# freeze a new manifest. Reviewed by Claude (the AI that wrote this harness), not by a domain expert,
# and only the withdrawal comments were read.
#
# The filter is weakest on long comments, where boilerplate passes its word count. That is why the
# list for the WithdrarXiv sample is long.

# ---------------------------------------------------------------- recent-2026h2

# The flaw is not in the version that would be reviewed.
[[exclude]]
id = "2505.23202"
reason = "wrong version: the error was in v2 and v3 had already withdrawn the claim"

# The flaw cannot be seen from this paper's text.
[[exclude]]
