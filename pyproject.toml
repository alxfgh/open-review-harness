[project]
name = "open-review-harness"
version = "0.1.0"
description = "Tests whether LLM paper review finds real errors, on papers withdrawn after each model's training cutoff."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "anthropic>=2.6",
    "google-genai>=3.0",
    "httpx>=0.28",
    "openai>=3.48",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pypdfium2>=4.30",
]

[project.scripts]
orh = "review_harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
# E501: the formatter handles code width, and the long lines left are prose.
ignore = ["S101", "S311", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
