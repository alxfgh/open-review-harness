# Model registry. A paper only counts as unseen by a model if it was withdrawn after that model's
# knowledge_cutoff, so these dates decide what the results mean. Read from provider documentation
# on 2026-11-09; check `source` before relying on them.
#
# price_verified = false means the price was not on the provider's current pricing page. It only
# affects cost estimates, never scores.

[models."gpt-6-astra"]
provider = "openai"
knowledge_cutoff = "2026-04-30"
input_per_mtok = 10.00
cached_per_mtok = 1.00
output_per_mtok = 50.00
effort = "medium"
price_verified = true
source = "https://developers.openai.com/api/docs/models/gpt-6-astra"

