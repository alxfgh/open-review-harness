# Synthetic papers written for this repository, each with one planted error and a known answer.
# They test the harness rather than the science: if a capable model misses these, suspect the
# plumbing (parsing, prompts, ranking, judge) before drawing any conclusion from real papers.

[[canary]]
file = "sample_totals.md"
title = "Sleep duration and reaction time in shift workers"
category = "stat.AP"
gold = "The site counts in Table 1 sum to 270 (90 + 85 + 95), not the stated total of 250 participants, so the sample size is inconsistent."

[[canary]]
file = "false_induction.md"
title = "A prime-generating polynomial valid for all positive integers"
category = "math.NT"
gold = "Theorem 1 is false: f(40) = 40^2 + 40 + 41 = 1681 = 41^2 is composite, and the induction step wrongly assumes an odd value must be prime."

[[canary]]
